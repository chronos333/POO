<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quitanda MVC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Quitanda MVC</h1>

    <div class="box">
      <h2>Cadastrar Produto</h2>
      <input id="nome" placeholder="Nome">
      <input id="preco" type="number" placeholder="Preço">
      <input id="qtd" type="number" placeholder="Quantidade">
      <button id="btnAdd">Adicionar</button>
    </div>

    <div class="box">
      <h2>Produtos</h2>
      <ul id="lista"></ul>
    </div>

    <div class="box">
      <h2>Venda</h2>
      <input id="nomeVenda" placeholder="Nome">
      <input id="qtdVenda" type="number" placeholder="Quantidade">
      <button id="btnVenda">Vender</button>
    </div>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
